name: PDF regression (no Airtable writes)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pdf-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static checks
        run: npm run check
      - name: PDF and image regression tests
        run: npm test
